name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: go vet ./...
      - name: go test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        # -race requires cgo; CGO_ENABLED defaults to 1 on the runner.
        # Production binaries (build step below) still ship with CGO_ENABLED=0.
        run: go test -race -count=1 ./...
      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/bm

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
