      - name: Commit gh-pages update
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html install.sh install.ps1 manager/index.html manager/bm/index.html manager/bm/release manager/bm/archives
          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit"
            exit 0
          fi
          git commit -m "Update bm release pointers for ${{ github.ref_name }}"
      - name: Push gh-pages update
        run: |
          set -euo pipefail
          cd pages
          git push origin gh-pages
