name: Release

on:
  push:
    tags:
      - "RELEASE.*"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""
            pointer_name: bm
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""
            pointer_name: bm
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""
            pointer_name: bm
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""
            pointer_name: bm
          - goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: ".exe"
            pointer_name: bm.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN="bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}"
          LDFLAGS="-s -w -X 'github.com/buckit-io/bm/internal/version.Version=${VERSION}' -X 'github.com/buckit-io/bm/internal/version.Commit=${COMMIT}' -X 'github.com/buckit-io/bm/internal/version.Date=${DATE}'"

          go build -trimpath -ldflags "$LDFLAGS" -o "$BIN" ./cmd/bm
      - name: Generate checksum
        run: |
          set -euo pipefail
          BIN="bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}"
          sha256sum "$BIN" > "$BIN.sha256sum"
      - name: Sign with minisign
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          BIN="bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}"

          go install aead.dev/minisign/cmd/minisign@v0.3.0
          echo "$MINISIGN_PRIVATE_KEY" | base64 -d > /tmp/minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -Sm "$BIN" -s /tmp/minisign.key
          shred -u /tmp/minisign.key
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}
            bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}.sha256sum
            bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}.minisig
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums manifest
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f \
            ! -name '*.sha256sum' \
            ! -name '*.minisig' \
            -name 'bm-*' \
            -exec sha256sum {} \; | sed 's#  \./#  #' > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          files: |
            artifacts/bm-*
            artifacts/checksums.txt

  update-gh-pages:
    if: "!contains(github.ref_name, '.rc')"
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write self-update pointer files
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          base="pages/manager/bm/release"

          rm -rf "$base"
          mkdir -p pages/manager/bm/archives
          mkdir -p \
            "$base/linux-amd64" \
            "$base/linux-arm64" \
            "$base/darwin-amd64" \
            "$base/darwin-arm64" \
            "$base/windows-amd64"

          sha=$(awk '{print $1}' "artifacts/bm-linux-amd64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/linux-amd64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-linux-arm64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/linux-arm64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-darwin-amd64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/darwin-amd64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-darwin-arm64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/darwin-arm64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-windows-amd64.${tag}.exe.sha256sum")
          echo "${sha}  bm.exe.${tag}" > "$base/windows-amd64/bm.sha256sum"
      - name: Generate release index page
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          base="https://github.com/buckit-io/bm/releases/download/${tag}"

          cat > pages/manager/bm/release/index.html <<HTML
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Buckit Manager ${tag}</title>
            <style>
              body { font-family: sans-serif; max-width: 860px; margin: 2em auto; padding: 0 1em; }
              h2 { margin-bottom: 0.25em; }
              p { margin-top: 0.25em; color: #555; }
              table { border-collapse: collapse; width: 100%; margin-bottom: 2em; }
              th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }
              th { background: #f4f4f4; font-weight: 600; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h2>Buckit Manager ${tag}</h2>
            <p>Latest stable release — <a href="../archives/">all releases &rarr;</a></p>
            <table>
              <tr><th>Platform</th><th>Binary</th><th>Checksum</th><th>Signature</th><th>Pointer</th></tr>
              <tr>
                <td>Linux x86_64</td>
                <td><a href="${base}/bm-linux-amd64.${tag}">bm-linux-amd64</a></td>
                <td><a href="${base}/bm-linux-amd64.${tag}.sha256sum">.sha256sum</a></td>
                <td><a href="${base}/bm-linux-amd64.${tag}.minisig">.minisig</a></td>
                <td><a href="./linux-amd64/bm.sha256sum">version pointer</a></td>
              </tr>
              <tr>
                <td>Linux arm64</td>
                <td><a href="${base}/bm-linux-arm64.${tag}">bm-linux-arm64</a></td>
                <td><a href="${base}/bm-linux-arm64.${tag}.sha256sum">.sha256sum</a></td>
                <td><a href="${base}/bm-linux-arm64.${tag}.minisig">.minisig</a></td>
                <td><a href="./linux-arm64/bm.sha256sum">version pointer</a></td>
              </tr>
              <tr>
                <td>macOS x86_64</td>
                <td><a href="${base}/bm-darwin-amd64.${tag}">bm-darwin-amd64</a></td>
                <td><a href="${base}/bm-darwin-amd64.${tag}.sha256sum">.sha256sum</a></td>
                <td><a href="${base}/bm-darwin-amd64.${tag}.minisig">.minisig</a></td>
                <td><a href="./darwin-amd64/bm.sha256sum">version pointer</a></td>
              </tr>
              <tr>
                <td>macOS arm64</td>
                <td><a href="${base}/bm-darwin-arm64.${tag}">bm-darwin-arm64</a></td>
                <td><a href="${base}/bm-darwin-arm64.${tag}.sha256sum">.sha256sum</a></td>
                <td><a href="${base}/bm-darwin-arm64.${tag}.minisig">.minisig</a></td>
                <td><a href="./darwin-arm64/bm.sha256sum">version pointer</a></td>
              </tr>
              <tr>
                <td>Windows x86_64</td>
                <td><a href="${base}/bm-windows-amd64.${tag}.exe">bm-windows-amd64.${tag}.exe</a></td>
                <td><a href="${base}/bm-windows-amd64.${tag}.exe.sha256sum">.sha256sum</a></td>
                <td><a href="${base}/bm-windows-amd64.${tag}.exe.minisig">.minisig</a></td>
                <td><a href="./windows-amd64/bm.sha256sum">version pointer</a></td>
              </tr>
            </table>
          </body>
          </html>
          HTML
      - name: Generate archives index page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api repos/buckit-io/bm/releases --paginate \
            --jq '.[] | select(.prerelease == false) | {tag: .tag_name, date: .published_at[:10], url: .html_url}' \
            > /tmp/bm-releases.jsonl

          python3 - /tmp/bm-releases.jsonl pages/manager/bm/archives/index.html <<'PYEOF'
          import html, json, sys

          releases = [json.loads(line) for line in open(sys.argv[1]) if line.strip()]

          rows = '\n'.join(
              f'<tr>'
              f'<td>{html.escape(r["date"])}</td>'
              f'<td><a href="{html.escape(r["url"])}">{html.escape(r["tag"])}</a></td>'
              f'<td><a href="{html.escape(r["url"])}">Assets &rarr;</a></td>'
              f'</tr>'
              for r in releases
          )

          page = f'''<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Buckit Manager Releases</title>
            <style>
              body {{ font-family: sans-serif; max-width: 860px; margin: 2em auto; padding: 0 1em; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ text-align: left; padding: 8px 12px; border-bottom: 1px solid #ddd; }}
              th {{ background: #f4f4f4; font-weight: 600; }}
              a {{ color: #0366d6; text-decoration: none; }}
              a:hover {{ text-decoration: underline; }}
            </style>
          </head>
          <body>
            <h2>Buckit Manager Releases</h2>
            <p><a href="../release/">Latest release &rarr;</a></p>
            <table>
              <tr><th>Date</th><th>Release</th><th>Downloads</th></tr>
              {rows}
            </table>
          </body>
          </html>'''

          with open(sys.argv[2], 'w') as f:
              f.write(page)
          PYEOF
      - name: Generate directory index pages
        run: |
          set -euo pipefail

          cat > pages/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Buckit Manager Pages</title>
            <style>
              body { font-family: sans-serif; max-width: 860px; margin: 2em auto; padding: 0 1em; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h2>Buckit Manager Pages</h2>
            <ul>
              <li><a href="./manager/">Manager</a></li>
            </ul>
          </body>
          </html>
          HTML

          mkdir -p pages/manager
          cat > pages/manager/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Buckit Manager</title>
            <style>
              body { font-family: sans-serif; max-width: 860px; margin: 2em auto; padding: 0 1em; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h2>Buckit Manager</h2>
            <ul>
              <li><a href="./bm/">Self-update artifacts</a></li>
            </ul>
          </body>
          </html>
          HTML

          cat > pages/manager/bm/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>bm Artifacts</title>
            <style>
              body { font-family: sans-serif; max-width: 860px; margin: 2em auto; padding: 0 1em; }
              a { color: #0366d6; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h2>bm Artifacts</h2>
            <ul>
              <li><a href="./release/">Latest stable release</a></li>
              <li><a href="./archives/">Release archive</a></li>
            </ul>
          </body>
          </html>
          HTML
      - name: Commit gh-pages update
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manager/index.html manager/bm/index.html manager/bm/release manager/bm/archives
          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit"
            exit 0
          fi
          git commit -m "Update bm release pointers for ${{ github.ref_name }}"
      - name: Push gh-pages update
        run: |
          set -euo pipefail
          cd pages
          git push origin gh-pages
