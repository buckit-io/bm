name: Release

on:
  push:
    tags:
      - "RELEASE.*"

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-amd64
            ext: ""
            pointer_name: bm
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            ext: ""
            pointer_name: bm
          - goos: darwin
            goarch: amd64
            platform: darwin-amd64
            ext: ""
            pointer_name: bm
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
            ext: ""
            pointer_name: bm
          - goos: windows
            goarch: amd64
            platform: windows-amd64
            ext: ".exe"
            pointer_name: bm.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache: true
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN="bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}"
          LDFLAGS="-s -w -X 'github.com/buckit-io/bm/internal/version.Version=${VERSION}' -X 'github.com/buckit-io/bm/internal/version.Commit=${COMMIT}' -X 'github.com/buckit-io/bm/internal/version.Date=${DATE}'"

          go build -trimpath -ldflags "$LDFLAGS" -o "$BIN" ./cmd/bm
      - name: Generate checksum
        run: |
          set -euo pipefail
          BIN="bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}"
          sha256sum "$BIN" > "$BIN.sha256sum"
      - name: Sign with minisign
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          BIN="bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}"

          go install aead.dev/minisign/cmd/minisign@v0.3.0
          echo "$MINISIGN_PRIVATE_KEY" | base64 -d > /tmp/minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -Sm "$BIN" -s /tmp/minisign.key
          shred -u /tmp/minisign.key
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}
            bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}.sha256sum
            bm-${{ matrix.platform }}.${{ github.ref_name }}${{ matrix.ext }}.minisig
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums manifest
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f \
            ! -name '*.sha256sum' \
            ! -name '*.minisig' \
            -name 'bm-*' \
            -exec sha256sum {} \; | sed 's#  \./#  #' > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          files: |
            artifacts/bm-*
            artifacts/checksums.txt

  update-gh-pages:
    if: "!contains(github.ref_name, '.rc')"
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages
      - uses: actions/checkout@v5
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish install scripts
        run: |
          set -euo pipefail
          cp src/packaging/install.sh pages/install.sh
          cp src/packaging/install.ps1 pages/install.ps1
      - name: Write self-update pointer files
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          base="pages/manager/bm/release"

          rm -rf "$base"
          mkdir -p pages/manager/bm/archives
          mkdir -p \
            "$base/linux-amd64" \
            "$base/linux-arm64" \
            "$base/darwin-amd64" \
            "$base/darwin-arm64" \
            "$base/windows-amd64"

          sha=$(awk '{print $1}' "artifacts/bm-linux-amd64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/linux-amd64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-linux-arm64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/linux-arm64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-darwin-amd64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/darwin-amd64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-darwin-arm64.${tag}.sha256sum")
          echo "${sha}  bm.${tag}" > "$base/darwin-arm64/bm.sha256sum"

          sha=$(awk '{print $1}' "artifacts/bm-windows-amd64.${tag}.exe.sha256sum")
          echo "${sha}  bm.exe.${tag}" > "$base/windows-amd64/bm.sha256sum"
      - name: Generate release index page
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"
          base="https://github.com/buckit-io/bm/releases/download/${tag}"

          cat > pages/manager/bm/release/index.html <<HTML
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Buckit Manager ${tag}</title>
            <style>
              :root { color-scheme: light; --bg: #f3f5f9; --surface: #ffffff; --surface-alt: #f8fafc; --border: #d8dee9; --text: #0f172a; --muted: #475569; --link: #0f766e; --link-hover: #115e59; --accent: #dcfce7; --accent-text: #166534; --shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }
              * { box-sizing: border-box; }
              body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
              .page { max-width: 1080px; margin: 0 auto; padding: 40px 20px 64px; }
              .hero, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
              .hero { padding: 28px; margin-bottom: 24px; }
              .eyebrow { display: inline-block; padding: 6px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
              h1 { margin: 14px 0 10px; font-size: 34px; line-height: 1.1; }
              .subhead { margin: 0 0 20px; max-width: 760px; color: var(--muted); font-size: 16px; line-height: 1.6; }
              .hero-actions, .meta { display: flex; flex-wrap: wrap; gap: 12px; }
              .meta { margin-top: 18px; }
              .meta-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-alt); min-width: 160px; }
              .meta-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
              .meta-value { font-size: 14px; font-weight: 600; }
              .button, .text-link { color: var(--link); text-decoration: none; font-weight: 600; }
              .button { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid #99f6e4; background: #f0fdfa; }
              .button:hover, .text-link:hover { color: var(--link-hover); }
              .section-title { margin: 0 0 8px; font-size: 24px; }
              .section-copy { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
              .panel { padding: 24px; }
              .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
              .card { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-alt); padding: 18px; }
              .card h3 { margin: 0 0 8px; font-size: 18px; }
              .card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.5; }
              .card-links { display: grid; gap: 10px; }
              .download { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; border-radius: 10px; background: #0f172a; color: #ffffff; text-decoration: none; font-weight: 600; }
              .download:hover { background: #1e293b; }
              .aux-links { display: flex; flex-wrap: wrap; gap: 12px; }
              .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-alt); }
              table { width: 100%; border-collapse: collapse; }
              th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
              th { font-size: 12px; text-transform: uppercase; color: var(--muted); background: #eef2f7; letter-spacing: 0.04em; }
              tbody tr:last-child td { border-bottom: 0; }
              td strong { display: block; margin-bottom: 4px; }
              .footer-note { margin-top: 18px; color: var(--muted); font-size: 14px; line-height: 1.6; }
              a { color: var(--link); text-decoration: none; }
              a:hover { text-decoration: underline; }
              @media (max-width: 720px) {
                .page { padding: 24px 16px 48px; }
                .hero, .panel { padding: 20px; }
                h1 { font-size: 28px; }
              }
            </style>
          </head>
          <body>
            <div class="page">
              <section class="hero">
                <span class="eyebrow">Latest Stable Release</span>
                <h1>Buckit Manager</h1>
                <p class="subhead">Signed desktop binaries for operating Buckit clusters locally.</p>
                <p class="section-copy" style="margin-bottom:8px">Quick install (downloads, checksum-verifies, and installs the latest stable build):</p>
                <div style="margin:0 0 8px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px"><span style="color:var(--muted)"># macOS / Linux</span><br>curl -fsSL https://buckit-io.github.io/bm/install.sh | sh</div>
                <div style="margin:0 0 16px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-alt);overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px"><span style="color:var(--muted)"># Windows (PowerShell)</span><br>irm https://buckit-io.github.io/bm/install.ps1 | iex</div>
                <div class="hero-actions">
                  <a class="button" href="../archives/">Browse release archive</a>
                </div>
                <div class="meta">
                  <div class="meta-item">
                    <span class="meta-label">Release tag</span>
                    <span class="meta-value">${tag}</span>
                  </div>
                  <div class="meta-item">
                    <span class="meta-label">Repository</span>
                    <span class="meta-value">buckit-io/bm</span>
                  </div>
                </div>
              </section>

              <section class="panel">
                <h2 class="section-title">Downloads</h2>
                <p class="section-copy">Choose the binary for your OS and architecture. Each platform card includes the signed artifact and checksum.</p>
                <div class="cards">
                  <article class="card">
                    <h3>Linux x86_64</h3>
                    <p>Standard Linux build for x86_64 hosts.</p>
                    <div class="card-links">
                      <a class="download" href="${base}/bm-linux-amd64.${tag}">Download binary</a>
                      <div class="aux-links">
                        <a href="${base}/bm-linux-amd64.${tag}.sha256sum">Checksum</a>
                      </div>
                    </div>
                  </article>
                  <article class="card">
                    <h3>Linux arm64</h3>
                    <p>Linux build for ARM64 systems and cloud hosts.</p>
                    <div class="card-links">
                      <a class="download" href="${base}/bm-linux-arm64.${tag}">Download binary</a>
                      <div class="aux-links">
                        <a href="${base}/bm-linux-arm64.${tag}.sha256sum">Checksum</a>
                      </div>
                    </div>
                  </article>
                  <article class="card">
                    <h3>macOS x86_64</h3>
                    <p>macOS Intel build for legacy Apple hardware.</p>
                    <div class="card-links">
                      <a class="download" href="${base}/bm-darwin-amd64.${tag}">Download binary</a>
                      <div class="aux-links">
                        <a href="${base}/bm-darwin-amd64.${tag}.sha256sum">Checksum</a>
                      </div>
                    </div>
                  </article>
                  <article class="card">
                    <h3>macOS arm64</h3>
                    <p>Native Apple Silicon build for modern Macs.</p>
                    <div class="card-links">
                      <a class="download" href="${base}/bm-darwin-arm64.${tag}">Download binary</a>
                      <div class="aux-links">
                        <a href="${base}/bm-darwin-arm64.${tag}.sha256sum">Checksum</a>
                      </div>
                    </div>
                  </article>
                  <article class="card">
                    <h3>Windows x86_64</h3>
                    <p>Windows build for 64-bit desktop environments.</p>
                    <div class="card-links">
                      <a class="download" href="${base}/bm-windows-amd64.${tag}.exe">Download binary</a>
                      <div class="aux-links">
                        <a href="${base}/bm-windows-amd64.${tag}.exe.sha256sum">Checksum</a>
                      </div>
                    </div>
                  </article>
                </div>
                <p class="footer-note">Need the raw artifact names for automation or mirrors? The manifest below keeps the exact filenames and verification links in one place.</p>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr><th>Platform</th><th>Artifact</th><th>Checksum</th></tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><strong>Linux x86_64</strong>Standard Linux</td>
                        <td><a href="${base}/bm-linux-amd64.${tag}">bm-linux-amd64.${tag}</a></td>
                        <td><a href="${base}/bm-linux-amd64.${tag}.sha256sum">.sha256sum</a></td>
                      </tr>
                      <tr>
                        <td><strong>Linux arm64</strong>ARM64 Linux</td>
                        <td><a href="${base}/bm-linux-arm64.${tag}">bm-linux-arm64.${tag}</a></td>
                        <td><a href="${base}/bm-linux-arm64.${tag}.sha256sum">.sha256sum</a></td>
                      </tr>
                      <tr>
                        <td><strong>macOS x86_64</strong>Intel Macs</td>
                        <td><a href="${base}/bm-darwin-amd64.${tag}">bm-darwin-amd64.${tag}</a></td>
                        <td><a href="${base}/bm-darwin-amd64.${tag}.sha256sum">.sha256sum</a></td>
                      </tr>
                      <tr>
                        <td><strong>macOS arm64</strong>Apple Silicon</td>
                        <td><a href="${base}/bm-darwin-arm64.${tag}">bm-darwin-arm64.${tag}</a></td>
                        <td><a href="${base}/bm-darwin-arm64.${tag}.sha256sum">.sha256sum</a></td>
                      </tr>
                      <tr>
                        <td><strong>Windows x86_64</strong>64-bit Windows</td>
                        <td><a href="${base}/bm-windows-amd64.${tag}.exe">bm-windows-amd64.${tag}.exe</a></td>
                        <td><a href="${base}/bm-windows-amd64.${tag}.exe.sha256sum">.sha256sum</a></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </body>
          </html>
          HTML
      - name: Generate archives index page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api repos/buckit-io/bm/releases --paginate \
            --jq '.[] | select(.prerelease == false) | {tag: .tag_name, date: .published_at[:10], url: .html_url}' \
            > /tmp/bm-releases.jsonl

          python3 - /tmp/bm-releases.jsonl pages/manager/bm/archives/index.html <<'PYEOF'
          import html, json, sys

          releases = [json.loads(line) for line in open(sys.argv[1]) if line.strip()]

          rows = '\n'.join(
              f'<tr>'
              f'<td>{html.escape(r["date"])}</td>'
              f'<td><a href="{html.escape(r["url"])}">{html.escape(r["tag"])}</a></td>'
              f'<td><a href="{html.escape(r["url"])}">Assets &rarr;</a></td>'
              f'</tr>'
              for r in releases
          )

          page = f'''<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Buckit Manager Releases</title>
            <style>
              :root {{ color-scheme: light; --bg: #f3f5f9; --surface: #ffffff; --surface-alt: #f8fafc; --border: #d8dee9; --text: #0f172a; --muted: #475569; --link: #0f766e; --shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }}
              * {{ box-sizing: border-box; }}
              body {{ margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }}
              .page {{ max-width: 1080px; margin: 0 auto; padding: 40px 20px 64px; }}
              .hero, .panel {{ background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }}
              .hero {{ padding: 28px; margin-bottom: 24px; }}
              .eyebrow {{ display: inline-block; padding: 6px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700; text-transform: uppercase; }}
              h1 {{ margin: 14px 0 10px; font-size: 34px; line-height: 1.1; }}
              .subhead {{ margin: 0; max-width: 720px; color: var(--muted); line-height: 1.6; }}
              .actions {{ margin-top: 18px; }}
              .button {{ display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid #99f6e4; background: #f0fdfa; color: var(--link); text-decoration: none; font-weight: 600; }}
              .panel {{ padding: 24px; }}
              .table-wrap {{ overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-alt); }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--border); }}
              th {{ background: #eef2f7; font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }}
              tbody tr:last-child td {{ border-bottom: 0; }}
              .release-tag {{ font-weight: 600; }}
              .release-date {{ color: var(--muted); white-space: nowrap; }}
              a {{ color: var(--link); text-decoration: none; }}
              a:hover {{ text-decoration: underline; }}
              @media (max-width: 720px) {{
                .page {{ padding: 24px 16px 48px; }}
                .hero, .panel {{ padding: 20px; }}
                h1 {{ font-size: 28px; }}
              }}
            </style>
          </head>
          <body>
            <div class="page">
              <section class="hero">
                <span class="eyebrow">Release Archive</span>
                <h1>Buckit Manager Releases</h1>
                <p class="subhead">Stable Buckit Manager releases published to GitHub. Open any release to inspect artifacts, checksums, and signed binaries, or jump back to the current release landing page.</p>
                <div class="actions">
                  <a class="button" href="../release/">Open latest release</a>
                </div>
              </section>
              <section class="panel">
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr><th>Date</th><th>Release</th><th>Downloads</th></tr>
                    </thead>
                    <tbody>
                      {rows}
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </body>
          </html>'''

          with open(sys.argv[2], 'w') as f:
              f.write(page)
          PYEOF
      - name: Generate directory index pages
        run: |
          set -euo pipefail

          cat > pages/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Buckit Manager Pages</title>
            <style>
              :root { color-scheme: light; --bg: #f3f5f9; --surface: #ffffff; --border: #d8dee9; --text: #0f172a; --muted: #475569; --link: #0f766e; --shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }
              * { box-sizing: border-box; }
              body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
              .page { max-width: 920px; margin: 0 auto; padding: 40px 20px 64px; }
              .hero, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
              .hero { padding: 28px; margin-bottom: 24px; }
              .eyebrow { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700; text-transform: uppercase; }
              h1 { margin: 14px 0 10px; font-size: 34px; line-height: 1.1; }
              p { margin: 0; color: var(--muted); line-height: 1.6; }
              .panel { padding: 24px; }
              .link-list { display: grid; gap: 14px; }
              .link-card { display: block; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px; background: #f8fafc; color: var(--text); text-decoration: none; }
              .link-card strong { display: block; margin-bottom: 6px; }
              .link-card span { color: var(--muted); }
              a { color: var(--link); text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <div class="page">
              <section class="hero">
                <span class="eyebrow">Static Pages</span>
                <h1>Buckit Manager Pages</h1>
                <p>Static indexes published through GitHub Pages for Buckit Manager release navigation and self-update discovery.</p>
              </section>
              <section class="panel">
                <div class="link-list">
                  <a class="link-card" href="./manager/">
                    <strong>Manager release assets</strong>
                    <span>Open the Buckit Manager release and archive indexes.</span>
                  </a>
                </div>
              </section>
            </div>
          </body>
          </html>
          HTML

          mkdir -p pages/manager
          cat > pages/manager/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Buckit Manager</title>
            <style>
              :root { color-scheme: light; --bg: #f3f5f9; --surface: #ffffff; --border: #d8dee9; --text: #0f172a; --muted: #475569; --link: #0f766e; --shadow: 0 18px 40px rgba(15, 23, 42, 0.08); }
              * { box-sizing: border-box; }
              body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
              .page { max-width: 920px; margin: 0 auto; padding: 40px 20px 64px; }
              .hero, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
              .hero { padding: 28px; margin-bottom: 24px; }
              .eyebrow { display: inline-block; padding: 6px 10px; border-radius: 999px; background: #dcfce7; color: #166534; font-size: 12px; font-weight: 700; text-transform: uppercase; }
              h1 { margin: 14px 0 10px; font-size: 34px; line-height: 1.1; }
              p { margin: 0; color: var(--muted); line-height: 1.6; }
              .panel { padding: 24px; }
              .link-list { display: grid; gap: 14px; }
              .link-card { display: block; padding: 16px 18px; border: 1px solid var(--border); border-radius: 12px; background: #f8fafc; color: var(--text); text-decoration: none; }
              .link-card strong { display: block; margin-bottom: 6px; }
              .link-card span { color: var(--muted); }
              a { color: var(--link); text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
